[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "textual-flowview"
version = "0.6.2"
description = "The virtualized feed widget for AI-agent, chat, and log TUIs in Textual."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tetsuya Yasuda" }]
keywords = [
    "textual", "tui", "widget", "virtualized", "flow", "feed",
    "chat", "ai-agent", "llm", "transcript", "log", "timeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = ["textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual-dev>=1.5", "mypy>=1.8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/tya5/textual-flowview"
Repository = "https://github.com/tya5/textual-flowview"
Issues = "https://github.com/tya5/textual-flowview/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/textual_flowview"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so results are identical regardless of the ruff version
# CI happens to install.
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally unpack tuples they don't fully use.
"tests/*" = ["RUF059"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pyright]
extraPaths = ["src"]
pythonVersion = "3.11"
